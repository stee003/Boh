<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VECTORBREAK relay desk</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.45 "Segoe UI", sans-serif; background: #0c1016; color: #e7eef6; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 18px 48px; }
    h1 { font-size: 22px; letter-spacing: 0.08em; margin: 0 0 8px; }
    p { color: #9eb0c2; }
    form, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button, select { background: #161d27; color: inherit; border: 1px solid #2c3848; border-radius: 8px; padding: 8px 10px; }
    button { cursor: pointer; }
    article { border: 1px solid #243140; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
    .fine { color: #8aa0b4; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Relay desk</h1>
    <p id="blurb" class="fine"></p>
    <form id="keyform">
      <input id="key" type="password" autocomplete="off" />
      <button type="submit" id="open">Open</button>
      <button type="button" id="lang">IT</button>
    </form>
    <div id="list"></div>
    <h2 id="audit-title"></h2>
    <div id="audit"></div>
  </main>
  <script>
    const state = { lang: localStorage.getItem('vb-admin-lang') || 'en', strings: {} };
    const t = (key) => state.strings[key] || key;
    async function loadStrings() {
      const res = await fetch('/api/strings?lang=' + state.lang);
      state.strings = await res.json();
      document.documentElement.lang = state.lang;
      document.getElementById('title').textContent = t('admin.title');
      document.getElementById('open').textContent = t('menu.confirm');
      document.getElementById('key').placeholder = t('admin.key');
      document.getElementById('audit-title').textContent = t('admin.audit');
      document.getElementById('lang').textContent = state.lang === 'en' ? 'IT' : 'EN';
    }
    async function load() {
      const key = document.getElementById('key').value;
      const headers = { 'x-admin-key': key };
      const res = await fetch('/api/admin/reports', { headers });
      const box = document.getElementById('list');
      if (!res.ok) { box.textContent = t('error.bad_packet'); return; }
      const data = await res.json();
      const reports = data.reports || [];
      box.innerHTML = reports.length ? '' : `<p>${t('admin.empty')}</p>`;
      for (const r of reports) {
        const el = document.createElement('article');
        el.innerHTML = `<strong>${r.targetName || r.target}</strong> · ${t('report.' + r.reason)}<p class="fine">${r.note || ''} · ${r.matchId || ''}</p>`;
        const row = document.createElement('div');
        row.className = 'row';
        for (const action of ['kick', 'mute', 'ban', 'dismiss']) {
          const b = document.createElement('button');
          b.textContent = t('admin.' + action);
          b.addEventListener('click', () => act(action, r, key));
          row.append(b);
        }
        el.append(row);
        box.append(el);
      }
      const audit = document.getElementById('audit');
      audit.innerHTML = '';
      for (const row of data.audit || []) {
        const p = document.createElement('p');
        p.className = 'fine';
        p.textContent = `${new Date(row.at).toLocaleString()} · ${row.action} · ${row.detail}`;
        audit.append(p);
      }
    }
    async function act(action, report, key) {
      await fetch('/api/admin/action', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-admin-key': key },
        body: JSON.stringify({ action, reportId: report.id, target: report.target }),
      });
      load();
    }
    document.getElementById('keyform').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    document.getElementById('lang').addEventListener('click', async () => {
      state.lang = state.lang === 'en' ? 'it' : 'en';
      localStorage.setItem('vb-admin-lang', state.lang);
      await loadStrings();
    });
    loadStrings();
  </script>
</body>
</html>
